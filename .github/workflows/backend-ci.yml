name: Backend CI/CD

on:
  push:
    branches:
      - main
      - backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. تثبيت .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. تثبيت Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      # 4. تثبيت Yarn
      - name: Setup Yarn
        run: npm install -g yarn@1.22.22

      # 5. تثبيت ABP CLI بنفس إصدار المشروع
      - name: Setup ABP CLI
        run: |
          dotnet tool install -g Volo.Abp.Cli --version 10.4.1
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      # 6. Restore
      - name: Restore
        run: |
          dotnet restore src/Forge.HttpApi.Host/Forge.HttpApi.Host.csproj

      # 7. تثبيت مكتبات ABP و JavaScript
      - name: Install ABP Client Libraries
        run: |
          abp install-libs

      # 8. التأكد أن المكتبات نزلت
      - name: Verify Client Libraries
        run: |
          echo "Checking wwwroot/libs..."
          ls -lah src/Forge.HttpApi.Host/wwwroot/libs

      # 9. Build + Publish
      - name: Publish Backend
        run: |
          dotnet publish src/Forge.HttpApi.Host/Forge.HttpApi.Host.csproj \
            -c Release \
            -o src/Forge.HttpApi.Host/bin/Release/net10.0/publish

      # 10. التأكد أن المكتبات دخلت داخل Publish
      - name: Verify Published Libraries
        run: |
          echo "Checking published wwwroot/libs..."
          ls -lah src/Forge.HttpApi.Host/bin/Release/net10.0/publish/wwwroot/libs

      # 11. بناء Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t luqya-api:latest \
            -f src/Forge.HttpApi.Host/Dockerfile \
            src/Forge.HttpApi.Host

      # 12. التأكد من Docker Image
      - name: Verify Docker Image
        run: |
          docker run --rm \
            --entrypoint sh \
            luqya-api:latest \
            -c "ls -ld /app/wwwroot/libs && grep -A3 'ConnectionStrings' /app/appsettings.json"

      # 13. تحويل Docker Image إلى ملف
      - name: Save Docker Image
        run: |
          docker save luqya-api:latest -o luqya-api.tar

      # 14. رفع الـ Image للسيرفر
      - name: Copy Image to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./luqya-api.tar"
          target: "/opt/projects/Leap"
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      # 15. تشغيل النسخة الجديدة
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd /opt/projects/Leap

            echo "========================================"
            echo "Loading new Docker image..."
            echo "========================================"

            docker load -i luqya-api.tar

            echo "========================================"
            echo "Saving current image as previous..."
            echo "========================================"

            if docker inspect luqya-api >/dev/null 2>&1; then

              CURRENT_IMAGE=$(docker inspect luqya-api --format '{{.Image}}')

              if docker image inspect "$CURRENT_IMAGE" >/dev/null 2>&1; then
                docker tag "$CURRENT_IMAGE" luqya-api:previous
                echo "Previous image saved: $CURRENT_IMAGE"
              fi

            fi

            echo "========================================"
            echo "Stopping old container..."
            echo "========================================"

            docker stop luqya-api || true

            echo "========================================"
            echo "Removing old container..."
            echo "========================================"

            docker rm luqya-api || true

            echo "========================================"
            echo "Starting new container..."
            echo "========================================"

            docker run -d \
              --name luqya-api \
              --restart unless-stopped \
              -p 8080:80 \
              --env-file /opt/projects/Leap/luqya-api.env \
              -e ASPNETCORE_FORWARDEDHEADERS_ENABLED=true \
              -v /opt/projects/Leap/openiddict.pfx:/app/openiddict.pfx:ro \
              luqya-api:latest

            echo "========================================"
            echo "Waiting for container to start..."
            echo "========================================"

            sleep 10

            echo "========================================"
            echo "Checking container status..."
            echo "========================================"

            if [ "$(docker inspect -f '{{.State.Running}}' luqya-api 2>/dev/null)" != "true" ]; then

              echo "ERROR: New container is not running!"

              echo "Container logs:"
              docker logs --tail 100 luqya-api

              echo "Attempting rollback..."

              docker rm -f luqya-api || true

              if docker image inspect luqya-api:previous >/dev/null 2>&1; then

                docker run -d \
                  --name luqya-api \
                  --restart unless-stopped \
                  -p 8080:80 \
                  --env-file /opt/projects/Leap/luqya-api.env \
                  -e ASPNETCORE_FORWARDEDHEADERS_ENABLED=true \
                  -v /opt/projects/Leap/openiddict.pfx:/app/openiddict.pfx:ro \
                  luqya-api:previous

                echo "Rollback completed."

              else

                echo "ERROR: Previous image not found."
                exit 1

              fi

              exit 1

            fi

            echo "Container is running successfully."

            echo "========================================"
            echo "Container status"
            echo "========================================"

            docker ps --filter "name=luqya-api"

            echo "========================================"
            echo "Checking container environment..."
            echo "========================================"

            docker exec luqya-api sh -c \
              'printenv | grep -E "ASPNETCORE_FORWARDEDHEADERS_ENABLED|LostFound__AI__" | sed "s/=.*/=SET/"'

            echo "========================================"
            echo "Checking container logs..."
            echo "========================================"

            docker logs --tail 50 luqya-api

            echo "========================================"
            echo "Deployment completed successfully!"
            echo "========================================"
