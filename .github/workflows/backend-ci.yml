name: Backend CI/CD

on:
  push:
    branches:
      - main
      - backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. تثبيت .NET 10
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. استعادة الحزم
      - name: Restore
        run: dotnet restore src/Forge.HttpApi.Host/Forge.HttpApi.Host.csproj

      # 4. Build + Publish
      - name: Publish Backend
        run: |
          dotnet publish src/Forge.HttpApi.Host/Forge.HttpApi.Host.csproj \
            -c Release \
            -o src/Forge.HttpApi.Host/bin/Release/net10.0/publish

      # 5. بناء Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t luqya-api:latest \
            -f src/Forge.HttpApi.Host/Dockerfile \
            src/Forge.HttpApi.Host

      # 6. تحويل Docker Image إلى ملف
      - name: Save Docker Image
        run: |
          docker save luqya-api:latest -o luqya-api.tar

           # 7. رفع الـ Image للسيرفر
      - name: Copy Image to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./luqya-api.tar"
          target: "/opt/projects/Leap"
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      # 8. تشغيل النسخة الجديدة
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/projects/Leap

            echo "Loading new Docker image..."
            docker load -i luqya-api.tar

            echo "Stopping old container..."
            docker stop luqya-api || true

            echo "Removing old container..."
            docker rm luqya-api || true

            echo "Starting new container..."
            docker run -d \
              --name luqya-api \
              --restart unless-stopped \
              -p 8080:80 \
              -v /opt/projects/Leap/openiddict.pfx:/app/openiddict.pfx \
              luqya-api:latest

            echo "Deployment completed!"

            docker ps --filter "name=luqya-api"
