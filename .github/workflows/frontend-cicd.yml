name: Frontend CI/CD

on:
  push:
    branches:
      - frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. إعداد Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # 3. تثبيت dependencies
      - name: Install dependencies
        run: npm ci

      # 4. بناء Frontend
      - name: Build Frontend
        run: npm run build

      # 5. ضغط ملفات الـ Frontend
      - name: Create Frontend Archive
        run: |
          tar -czf frontend-dist.tar.gz -C dist .

      # 6. رفع ملفات Frontend للسيرفر
      - name: Copy Frontend to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend-dist.tar.gz"
          target: "/opt/projects/Leap"
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      # 7. نشر Frontend على السيرفر
      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            echo "========================================"
            echo "Starting Frontend deployment..."
            echo "========================================"

            cd /opt/projects/Leap

            # Backup للنسخة الحالية قبل التحديث
            echo "Creating backup of current frontend..."

            tar -czf \
              "luqya-frontend-before-deploy-$(date +%Y%m%d-%H%M%S).tar.gz" \
              -C /var/www html

            echo "Backup created successfully."

            # حذف الملفات القديمة فقط بعد نجاح الـ backup
            echo "Removing old frontend files..."

            rm -rf /var/www/html/*

            # استخراج النسخة الجديدة
            echo "Extracting new frontend..."

            tar -xzf frontend-dist.tar.gz -C /var/www/html

            echo "Frontend files deployed."

            # التأكد أن الملفات موجودة
            echo "Checking deployed files..."

            ls -lah /var/www/html

            echo "========================================"
            echo "Frontend deployment completed successfully!"
            echo "========================================"
