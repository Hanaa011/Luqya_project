name: AI CI/CD

on:
  push:
    branches:
      - ai-feature

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. إعداد Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. تثبيت dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai_service/requirements.txt

      # 4. بناء Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t luqya-ai-api:latest \
            -f ai_service/Dockerfile \
            ai_service

      # 5. التأكد أن Docker Image انبنت
      - name: Verify Docker Image
        run: |
          docker image inspect luqya-ai-api:latest
          echo "Docker image built successfully."

      # 6. حفظ Docker Image كملف
      - name: Save Docker Image
        run: |
          docker save luqya-ai-api:latest -o luqya-ai-api.tar

      # 7. رفع Image للسيرفر
      - name: Copy Image to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./luqya-ai-api.tar"
          target: "/opt/projects/Leap"
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      # 8. Deploy على السيرفر
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd /opt/projects/Leap

            echo "========================================"
            echo "Loading new AI Docker image..."
            echo "========================================"

            docker load -i luqya-ai-api.tar

            echo "========================================"
            echo "Saving current AI image as previous..."
            echo "========================================"

            if docker inspect luqya-ai-api >/dev/null 2>&1; then
              CURRENT_IMAGE=$(docker inspect luqya-ai-api --format '{{.Image}}')

              if docker image inspect "$CURRENT_IMAGE" >/dev/null 2>&1; then
                docker tag "$CURRENT_IMAGE" luqya-ai-api:previous
                echo "Previous AI image saved: $CURRENT_IMAGE"
              fi
            fi

            echo "========================================"
            echo "Saving current AI environment..."
            echo "========================================"

            docker inspect luqya-ai-api \
              --format '{{range .Config.Env}}{{println .}}{{end}}' \
              > /opt/projects/Leap/luqya-ai-api.env

            echo "AI environment saved."

            echo "========================================"
            echo "Stopping old AI container..."
            echo "========================================"

            docker stop luqya-ai-api || true

            echo "========================================"
            echo "Removing old AI container..."
            echo "========================================"

            docker rm luqya-ai-api || true

            echo "========================================"
            echo "Starting new AI container..."
            echo "========================================"

            docker run -d \
              --name luqya-ai-api \
              --restart unless-stopped \
              -p 8081:8000 \
              --env-file /opt/projects/Leap/luqya-ai-api.env \
              luqya-ai-api:latest

            echo "========================================"
            echo "Waiting for AI container..."
            echo "========================================"

            sleep 10

            echo "========================================"
            echo "Checking container status..."
            echo "========================================"

            if [ "$(docker inspect -f '{{.State.Running}}' luqya-ai-api 2>/dev/null)" != "true" ]; then
              echo "ERROR: New AI container is not running!"
              echo "Container logs:"
              docker logs --tail 100 luqya-ai-api
              exit 1
            fi

            echo "AI container is running."

            echo "========================================"
            echo "Running AI health check..."
            echo "========================================"

            HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/)

            echo "AI health check status: $HEALTH_STATUS"

            if [ "$HEALTH_STATUS" != "200" ]; then

              echo "ERROR: AI health check failed!"
              echo "Rolling back to previous AI image..."

              docker stop luqya-ai-api || true
              docker rm luqya-ai-api || true

              docker run -d \
                --name luqya-ai-api \
                --restart unless-stopped \
                -p 8081:8000 \
                --env-file /opt/projects/Leap/luqya-ai-api.env \
                luqya-ai-api:previous

              sleep 5

              echo "Rollback completed."

              docker logs --tail 50 luqya-ai-api

              exit 1
            fi

            echo "========================================"
            echo "AI health check passed."
            echo "========================================"

            docker ps --filter "name=luqya-ai-api"

            echo "========================================"
            echo "AI container logs..."
            echo "========================================"

            docker logs --tail 50 luqya-ai-api

            echo "========================================"
            echo "AI deployment completed successfully!"
            echo "========================================"
