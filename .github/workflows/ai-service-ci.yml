name: AI Service CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "ai_service/**"
      - ".github/workflows/ai-service-ci.yml"
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t luqya-ai:latest \
            -f ai_service/Dockerfile \
            ai_service

      # 3. Save Docker image
      - name: Save Docker Image
        run: |
          docker save luqya-ai:latest -o luqya-ai.tar

      # 4. Copy image to server
      - name: Copy Image to Server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./luqya-ai.tar"
          target: "/opt/projects/Leap"
          overwrite: true
          timeout: 120s
          command_timeout: 10m

      # 5. Deploy on server
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          script: |
            set -e

            cd /opt/projects/Leap

            echo "========================================"
            echo "Checking prerequisites..."
            echo "========================================"

            # AI service environment file must exist on the server.
            if [ ! -f /opt/projects/Leap/luqya-ai.env ]; then
              echo "ERROR: /opt/projects/Leap/luqya-ai.env is missing."
              echo "Create the file with the required AI environment variables."
              exit 1
            fi

            echo "AI environment file found."

            echo "========================================"
            echo "Checking Docker network..."
            echo "========================================"

            # The existing production setup uses luqya-network.
            # Both backend and AI service will stay on the same network.
            if ! docker network inspect luqya-network >/dev/null 2>&1; then
              echo "ERROR: luqya-network does not exist."
              exit 1
            fi

            echo "luqya-network exists."

            echo "========================================"
            echo "Loading new Docker image..."
            echo "========================================"

            docker load -i luqya-ai.tar

            echo "========================================"
            echo "Saving current image as previous..."
            echo "========================================"

            if docker inspect luqya-ai-api >/dev/null 2>&1; then

              CURRENT_IMAGE=$(docker inspect luqya-ai-api --format '{{.Image}}')

              if docker image inspect "$CURRENT_IMAGE" >/dev/null 2>&1; then
                docker tag "$CURRENT_IMAGE" luqya-ai:previous
                echo "Previous image saved: $CURRENT_IMAGE"
              fi

            fi

            echo "========================================"
            echo "Stopping old AI container..."
            echo "========================================"

            docker stop luqya-ai-api || true

            echo "========================================"
            echo "Removing old AI container..."
            echo "========================================"

            docker rm luqya-ai-api || true

            echo "========================================"
            echo "Starting new AI container..."
            echo "========================================"

            # No public port is exposed.
            # AI service is available only through luqya-network.
            docker run -d \
              --name luqya-ai-api \
              --restart unless-stopped \
              --network luqya-network \
              --env-file /opt/projects/Leap/luqya-ai.env \
              luqya-ai:latest

            echo "========================================"
            echo "Waiting for container to start..."
            echo "========================================"

            sleep 10

            echo "========================================"
            echo "Checking container status..."
            echo "========================================"

            if [ "$(docker inspect -f '{{.State.Running}}' luqya-ai-api 2>/dev/null)" != "true" ]; then

              echo "ERROR: New AI container is not running!"

              echo "Container logs:"
              docker logs --tail 100 luqya-ai-api

              echo "========================================"
              echo "Attempting rollback..."
              echo "========================================"

              docker rm -f luqya-ai-api || true

              if docker image inspect luqya-ai:previous >/dev/null 2>&1; then

                docker run -d \
                  --name luqya-ai-api \
                  --restart unless-stopped \
                  --network luqya-network \
                  --env-file /opt/projects/Leap/luqya-ai.env \
                  luqya-ai:previous

                echo "Rollback completed."

              else

                echo "ERROR: Previous image not found."
                exit 1

              fi

              exit 1

            fi

            echo "AI container is running successfully."

            echo "========================================"
            echo "Container status"
            echo "========================================"

            docker ps --filter "name=luqya-ai-api"

            echo "========================================"
            echo "Checking container environment..."
            echo "========================================"

            docker exec luqya-ai-api sh -c \
              'printenv | grep -E "^BACKEND_API_URL|^ALLOWED_ORIGINS" ; printenv | grep -q "^OPENAI_API_KEY=" && echo "OPENAI_API_KEY=SET"'

            echo "========================================"
            echo "Checking AI service health..."
            echo "========================================"

            docker exec luqya-api sh -c \
              'python -c "import urllib.request; print(urllib.request.urlopen(\"http://luqya-ai-api:8000/health\", timeout=10).read().decode())"'

            echo "========================================"
            echo "Checking container logs..."
            echo "========================================"

            docker logs --tail 50 luqya-ai-api

            echo "========================================"
            echo "Deployment completed successfully!"
            echo "========================================"
